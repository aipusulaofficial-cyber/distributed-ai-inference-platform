name: security-sbom

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Filesystem vulnerability and secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          exit-code: "1"
          ignore-unfixed: true
      - name: CycloneDX SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
