name: Benchmark And Reliability Evidence
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Failure injection tests
        run: python -m pytest reliability/test_failure_injection.py -q
      - name: Benchmark harness
        run: |
          mkdir -p artifacts
          python benchmarks/run_benchmark.py --iterations 1000 | tee artifacts/benchmark.json
      - name: Inference path evidence
        run: |
          python benchmarks/inference_evidence.py
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/inference-evidence.json").read_text(encoding="utf-8"))
          if report["error_rate"] != 0:
              raise SystemExit(f"inference evidence gate failed: error_rate={report['error_rate']}")
          print(f"inference evidence passed: p95_ms={report['latency_ms']['p95']}")
          PY
      - name: Upload measured evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-evidence
          path: artifacts/*.json