apiVersion: apps/v1
kind: Deployment
metadata: {name: distributed-ai-inference-platform}
spec:
 replicas: 2
 selector: {matchLabels: {app: distributed-ai-inference-platform}}
 template:
  metadata: {labels: {app: distributed-ai-inference-platform}}
  spec:
   containers:
    - name: api
      image: distributed-ai-inference-platform:latest
      ports: [{containerPort: 8000}]
      readinessProbe: {httpGet: {path: /health/ready, port: 8000}}
      livenessProbe: {httpGet: {path: /health/live, port: 8000}}
      resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: distributed-ai-inference-platform}
spec:
 selector: {app: distributed-ai-inference-platform}
 ports: [{port: 80, targetPort: 8000}]
